name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: vulnerabilities (govulncheck)
        # Fails when a known vulnerability is reachable from this code.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npx tsc -b
      - name: lint
        run: npx oxlint
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build
      - name: dependencies
        run: npm audit --omit=dev --audit-level=high

  binary:
    name: One-file build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: build (frontend + backend in one binary)
        run: ./scripts/build.sh
      - name: the binary carries the web interface
        run: |
          strings bin/squidadmin-backend | grep -q "Squid Admin Panel"
          strings bin/squidadmin-backend | grep -q "assets/index-"
      - uses: actions/upload-artifact@v4
        with:
          name: squidadmin-backend-linux-amd64
          path: bin/squidadmin-backend
          retention-days: 14
